[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-mathematical-optimization-autoformulation"
version = "0.1.0"
description = "A verification-first laboratory for translating natural-language OR problems into solver-ready LP/MILP models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "jorsacademy" }]
keywords = [
  "operations-research",
  "mathematical-optimization",
  "large-language-models",
  "autoformulation",
  "mixed-integer-programming",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
openai = ["openai>=1.50,<3"]
dev = [
  "mypy>=1.11,<2",
  "openai>=1.50,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
or-autoformulate = "autoformulation.cli:main"

[project.urls]
Repository = "https://github.com/jorsacademy/llm-mathematical-optimization-autoformulation"
Issues = "https://github.com/jorsacademy/llm-mathematical-optimization-autoformulation/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["autoformulation"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 88

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
